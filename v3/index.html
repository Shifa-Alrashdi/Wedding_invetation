<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دعوة حفل زفاف</title>
<meta name="description" content="يسعدنا تشريفكم حفل زفاف ابنتنا، نرجو تأكيد الحضور">
<meta property="og:title" content="دعوة حفل زفاف">
<meta property="og:description" content="أنس ورفيدة · الأربعاء ٢٣ ديسمبر ٢٠٢٦ · نرجو تأكيد الحضور">
<meta property="og:type" content="website">
<meta property="og:url" content="https://zafaf-invitation.netlify.app/">
<meta property="og:image" content="https://zafaf-invitation.netlify.app/assets/og-arch-lg.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#56364b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #56364b;
    --card: #fbf4ec;
    --ink: #3b2534;
    --muted: #8a7180;
    --gold: #6e4560;
    --gold-soft: #eadbd9;
    --blush: #d9c3cd;
    --yes: #6e4560;
    --no: #9b8590;
    --line: #ecdfdc;
    --tint: #f4e9e6;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Tajawal", system-ui, sans-serif;
    font-size: 17px;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  .wrap { max-width: 460px; margin: 0 auto; padding: 0; }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 28px;
    padding: 36px 24px 28px;
    text-align: center;
    position: relative;
    box-shadow: 0 10px 40px -20px rgba(120, 90, 60, .3);
  }
  .card::before {
    content: "";
    position: absolute; inset: 10px;
    border: 1px solid var(--gold-soft);
    border-radius: 20px;
    pointer-events: none;
  }
  .design { display: block; width: 100%; height: auto; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .invite {
    position: relative; aspect-ratio: 677 / 1207; container-type: inline-size;
    background: #fbf1e7 url("../assets/frame.jpg") center / 100% 100% no-repeat;
    border-radius: 22px; overflow: hidden;
    box-shadow: 0 14px 44px -22px rgba(120, 90, 60, .4);
  }
  .invite .inner {
    position: absolute; top: 23%; bottom: 15%; left: 21%; right: 21%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; gap: .6cqw;
  }
  .invite .bismillah { font-size: 4.6cqw; margin: 0 0 2cqw; color: var(--muted); }
  .invite .hosts { font-size: 4.2cqw; margin: 0; color: var(--gold); font-weight: 500; }
  .invite .lead { font-size: 4.2cqw; line-height: 1.6; margin: 0 0 2cqw; }
  .invite .name { font-size: 15cqw; line-height: 1.25; }
  .invite .amp { font-size: 6cqw; }
  .invite .groom { font-size: 10cqw; }
  .invite .divider { margin: 2.5cqw 0; width: 70%; font-size: 3.5cqw; }
  .invite .when { font-size: 4.6cqw; font-weight: 700; margin: 0; }
  .invite .small { font-size: 3.7cqw; color: var(--muted); margin: 0; }
  .invite .where { font-family: "Amiri", serif; font-size: 6cqw; font-weight: 700; color: var(--gold); margin: 3cqw 0 0; line-height: 1.3; }
  .ornament { color: var(--gold); width: 120px; height: auto; display: block; margin: 0 auto; }
  .bismillah { font-family: "Amiri", serif; color: var(--muted); font-size: 18px; margin: 14px 0 4px; }
  .hosts { color: var(--muted); font-size: 15px; margin: 0 0 6px; }
  .lead { font-size: 16px; margin: 0 0 18px; }
  .name {
    font-family: "Amiri", serif;
    font-weight: 700;
    font-size: 46px;
    line-height: 1.3;
    color: var(--gold);
    margin: 0;
  }
  .amp { font-family: "Amiri", serif; color: var(--blush); font-size: 26px; margin: 2px 0; }
  .divider { display: flex; align-items: center; gap: 10px; margin: 22px 0; color: var(--gold); }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--gold-soft); }

  .details { display: grid; gap: 10px; text-align: right; }
  .row {
    display: flex; align-items: center; gap: 14px;
    background: var(--tint); border-radius: 16px; padding: 12px 14px;
  }
  .row svg { flex: none; width: 22px; height: 22px; color: var(--gold); }
  .row b { display: block; font-weight: 700; font-size: 16px; }
  .row span { color: var(--muted); font-size: 14px; }

  .btn-map {
    display: inline-flex; align-items: center; gap: 8px; justify-content: center;
    margin-top: 12px; padding: 10px 18px;
    border: 1px solid var(--gold); color: var(--gold); border-radius: 999px;
    text-decoration: none; font-weight: 500; font-size: 15px;
  }

  .countdown { display: flex; justify-content: center; gap: 10px; margin-top: 22px; direction: rtl; }
  .cd { min-width: 64px; padding: 8px 4px; border-radius: 14px; background: var(--tint); }
  .cd b { display: block; font-size: 22px; color: var(--ink); line-height: 1.2; font-variant-numeric: tabular-nums; }
  .cd span { font-size: 12px; color: var(--muted); }

  .note { font-size: 14px; color: var(--muted); margin: 18px 0 0; }

  /* RSVP */
  .rsvp { margin-top: 0; text-align: right; }
  .rsvp h2 { font-family: "Amiri", serif; font-size: 28px; text-align: center; margin: 0 0 4px; color: var(--ink); }
  .rsvp .sub { text-align: center; color: var(--muted); font-size: 14px; margin: 0 0 20px; }
  label.lbl { display: block; font-weight: 500; font-size: 15px; margin: 0 0 6px; }
  input[type=text] {
    width: 100%; font: inherit; font-size: 17px;
    padding: 13px 16px; border-radius: 14px;
    border: 1px solid var(--line); background: #fff; color: var(--ink);
    outline: none;
  }
  input[type=text]:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(162, 135, 107, .18); }

  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 18px 0 0; }
  .choice {
    font: inherit; font-weight: 700; font-size: 17px;
    padding: 16px 10px; border-radius: 16px; cursor: pointer;
    border: 1.5px solid var(--line); background: #fff; color: var(--ink);
    transition: all .15s ease;
  }
  .choice.yes[aria-pressed=true] { background: var(--yes); border-color: var(--yes); color: #fff; }
  .choice.no[aria-pressed=true] { background: var(--no); border-color: var(--no); color: #fff; }
  .choice.maybe[aria-pressed=true] { background: var(--blush); border-color: var(--blush); color: var(--ink); }
  .choice.yes { grid-column: 1 / -1; }

  .count { margin-top: 16px; display: none; }
  .count.show { display: block; }
  .stepper { display: flex; align-items: center; justify-content: space-between; background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 6px; }
  .stepper button {
    width: 46px; height: 46px; border-radius: 12px; border: none;
    background: var(--tint); color: var(--gold); font-size: 24px; font-weight: 700; cursor: pointer;
  }
  .stepper output { font-size: 20px; font-weight: 700; }

  .submit {
    width: 100%; margin-top: 22px; padding: 16px;
    font: inherit; font-size: 18px; font-weight: 700;
    border: none; border-radius: 16px; cursor: pointer;
    background: var(--gold); color: #fff;
  }
  .submit:disabled { opacity: .5; cursor: default; }
  .err { color: var(--no); font-size: 14px; min-height: 22px; margin: 8px 0 0; text-align: center; }

  .done { display: none; text-align: center; padding: 10px 0; }
  .done.show { display: block; }
  .done .big { font-size: 34px; line-height: 1; color: var(--gold); }
  .done h3 { font-family: "Amiri", serif; font-size: 28px; margin: 10px 0 4px; }
  .done p { color: var(--muted); margin: 0; }
  .link { background: none; border: none; color: var(--gold); font: inherit; font-size: 14px; text-decoration: underline; cursor: pointer; margin-top: 14px; }

  .sample-banner { margin: 0; border-radius: 0; border-width: 0 0 1px;
    background: #fff4d6; color: #7a5a12; border: 1px solid #f0dca6;
    border-radius: 12px; font-size: 13px; padding: 8px 12px; margin-bottom: 14px; text-align: center;
  }

  /* RSVP inside the arch frame */
  .rsvp-wrap { container-type: inline-size; margin-top: -6%; position: relative; }
  .rsvp-frame {
    position: relative; aspect-ratio: 720 / 1320; text-align: right; color: #f6eadb;
    background: #5e3c50 url("../assets/frame-rsvp3.jpg") center / 100% 100% no-repeat;
    overflow: hidden;
  }
  .rsvp-frame { -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 6%, #000 97%, transparent 100%); mask-image: linear-gradient(to bottom, transparent 0, #000 6%, #000 97%, transparent 100%); }
  .design { -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 5%, #000 97%, transparent 100%); mask-image: linear-gradient(to bottom, transparent 0, #000 5%, #000 97%, transparent 100%); }
  .rsvp-frame .frame-inner { position: absolute; top: 7%; bottom: 40%; left: 18%; right: 18%;
    display: flex; flex-direction: column; justify-content: center; }
  .rsvp-frame #formView[hidden] { display: none; }
  .rsvp-frame .done.show { display: flex; flex-direction: column; justify-content: center; }
  .rsvp-frame .done:not(.show) { display: none; }
  .rsvp-frame h2 { font-size: 7.5cqw; line-height: 1.3; margin-bottom: 4cqw; }
  .rsvp-frame .sub { margin: 0 0 4cqw; font-size: 3.4cqw; }
  .rsvp-frame .choices { grid-template-columns: repeat(3, 1fr); }
  .rsvp-frame .choice.yes { grid-column: auto; }
  .rsvp-frame h2 { color: #f6eadb; font-size: 6.6cqw; margin-bottom: 2cqw; line-height: 1.3; }
  .rsvp-frame .sub { color: #d9c2c9; font-size: 13px; margin-bottom: 14px; }
  .rsvp-frame label.lbl { color: #f6eadb; font-size: 3.6cqw; }
  .rsvp-frame input[type=text] {
    background: rgba(255,255,255,.1); border-color: rgba(246,234,219,.4); color: #fff;
    padding: 2cqw 3.4cqw; font-size: 16px; border-radius: 3.4cqw;
  }
  .rsvp-frame input[type=text]::placeholder { color: #cdb5bf; }
  .rsvp-frame input[type=text]:focus { border-color: #f6eadb; box-shadow: none; }
  .rsvp-frame .choices { gap: 2cqw; margin-top: 2.5cqw; }
  .rsvp-frame .choice {
    background: transparent; color: #f6eadb; border-color: rgba(246,234,219,.5);
    padding: 2cqw 1cqw; font-size: 4cqw; border-radius: 3.4cqw;
  }
  .rsvp-frame .choice.yes[aria-pressed=true] { background: #f6eadb; border-color: #f6eadb; color: #4f3044; }
  .rsvp-frame .choice.maybe[aria-pressed=true] { background: rgba(246,234,219,.35); border-color: #f6eadb; color: #fff; }
  .rsvp-frame .choice.no[aria-pressed=true] { background: rgba(0,0,0,.25); border-color: #cdb5bf; color: #fff; }
  .rsvp-frame .count { margin-top: 2cqw; }
  .rsvp-frame label.lbl { margin-bottom: 1cqw; }
  .rsvp-frame .stepper { background: rgba(255,255,255,.08); border-color: rgba(246,234,219,.4); padding: 4px; }
  .rsvp-frame .stepper button { width: 7.5cqw; height: 7.5cqw; background: rgba(246,234,219,.15); color: #f6eadb; font-size: 20px; }
  .rsvp-frame .stepper output { color: #fff; font-size: 18px; }
  .rsvp-frame .submit { background: #f6eadb; color: #4f3044; margin-top: 2.5cqw; padding: 2.2cqw; font-size: 4.2cqw; border-radius: 3.4cqw; }
  .rsvp-frame .err { color: #ffd6d6; font-size: 3.4cqw; min-height: 0; margin: 1cqw 0 0; }
  .rsvp-frame .err:empty { display: none; }
  .rsvp-frame .done h3 { color: #f6eadb; }
  .rsvp-frame .done p { color: #e6d3d8; font-size: 15px; }
  .rsvp-frame .done .big { color: #f6eadb; }
  .rsvp-frame .link { color: #f6eadb; }

  /* map + countdown, blended into the page */
  .extras { text-align: center; padding: 26px 0 6px; color: #f6eadb; }
  .extras .btn-map { color: #f6eadb; border-color: rgba(246,234,219,.55); background: rgba(255,255,255,.06); }
  .extras .cd-title { font-family: "Amiri", serif; font-size: 20px; margin: 22px 0 6px; color: #e6d3c8; }
  .extras .countdown { margin-top: 0; gap: 0; align-items: stretch; }
  .extras .cd { background: none; border-radius: 0; min-width: 78px; padding: 2px 14px; }
  .extras .cd + .cd { border-right: 1px solid rgba(246,234,219,.3); }
  .extras .cd b { color: #f6eadb; font-family: "Amiri", serif; font-size: 34px; font-weight: 700; }
  .extras .cd span { color: #d9c2c9; font-size: 13px; }
  .extras .note:empty { display: none; }
  .rsvp-frame .extras { padding: 4cqw 0 0; margin-top: 5cqw; border-top: 1px solid rgba(246,234,219,.25); }
  .rsvp-frame .extras[hidden] { display: none; }
  .rsvp-frame .extras .btn-map { font-size: 3.4cqw; padding: 1.4cqw 3.6cqw; gap: 1.5cqw; }
  .rsvp-frame .extras .cd-title { font-size: 3.8cqw; margin: 1.5cqw 0 2cqw; line-height: 1.3; }
  .rsvp-frame .extras .cd { min-width: 11cqw; padding: 0 2.2cqw; }
  .rsvp-frame .extras .cd b { font-size: 5.5cqw; line-height: 1.25; }
  .rsvp-frame .extras .cd span { font-size: 2.8cqw; line-height: 1.2; }
  .rsvp-frame .done .big { font-size: 6cqw; }
  .rsvp-frame .done h3 { font-size: 7cqw; margin: 2cqw 0 1cqw; }
  .rsvp-frame .done p { font-size: 3.7cqw; line-height: 1.6; }
  .rsvp-frame .done .big { line-height: 1; }
  .rsvp-frame .link { margin-top: 1.5cqw; font-size: 3.4cqw; }
  footer { text-align: center; color: #e6d3c8; font-size: 13px; margin-top: 18px; }
</style>
</head>
<body>
<div class="wrap">


  <!-- Invitation -->
  <img class="design" src="../assets/invitation.jpg" width="720" height="1280"
       alt="دعوة حفل زفاف أنس ورفيدة، يوم الأربعاء ٢٣ ديسمبر ٢٠٢٦، قاعة أرينا، الاستقبال الساعة ٨:١٥ مساءً">
  <div class="sr-only">
    <p id="hosts"></p><p id="bride"></p><div id="groomWrap"><p id="groom"></p></div>
    <p id="dateText"></p><p id="dateSub"></p><p id="timeText"></p><p id="venue"></p><p id="city"></p>
  </div>

  <!-- RSVP -->
  <div class="rsvp-wrap">
  <section class="rsvp rsvp-frame">
   <div class="frame-inner">
    <div id="formView">
      <h2>تأكيد الحضور</h2>
      <p class="sub" id="deadline"></p>

      <input type="text" id="name" autocomplete="name" placeholder="الاسم" aria-label="الاسم">

      <div class="choices" role="group" aria-label="الحضور">
        <button type="button" class="choice yes" aria-pressed="false" data-v="yes">بحضر</button>
        <button type="button" class="choice maybe" aria-pressed="false" data-v="maybe">ربما</button>
        <button type="button" class="choice no" aria-pressed="false" data-v="no">أعتذر</button>
      </div>

      <div class="count" id="countBox">
        <label class="lbl">عدد الحضور</label>
        <div class="stepper">
          <button type="button" id="plus" aria-label="زيادة">+</button>
          <output id="countOut">1</output>
          <button type="button" id="minus" aria-label="نقص">−</button>
        </div>
      </div>

      <button class="submit" id="submit" type="button">إرسال</button>
      <p class="err" id="err" role="alert"></p>
    </div>

    <div class="done" id="doneView">
      <div class="big" id="doneEmoji">✦</div>
      <h3 id="doneTitle">شكراً لكِ</h3>
      <p id="doneText"></p>
      <button class="link" id="again" type="button">تعديل الرد</button>
    </div>
      <div class="extras" id="extras">
        <a class="btn-map" id="mapBtn" target="_blank" rel="noopener" style="margin-top:0">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
          موقع القاعة
        </a>
        <p class="cd-title">باقي على العرس</p>
        <div class="countdown" id="countdown" aria-label="العد التنازلي">
          <div class="cd"><b id="cdD">0</b><span>يوم</span></div>
          <div class="cd"><b id="cdH">0</b><span>ساعة</span></div>
          <div class="cd"><b id="cdM">0</b><span>دقيقة</span></div>
          <div class="cd"><b id="cdS">0</b><span>ثانية</span></div>
        </div>
        <p class="note" id="notes"></p>
      </div>
   </div>
  </section>
  </div>

</div>

<script>
/* ============================================================
   ✏️ عدّلي المعلومات هنا فقط
   ============================================================ */
const CONFIG = {
  hosts: "",                 // أسماء الداعين
  bride: "رفيدة",                         // اسم العروس
  groom: "أنس",                          // اسم العريس (اتركيه فاضي لإخفائه)
  dateISO: "2026-12-23T20:15:00+04:00",  // التاريخ والوقت (توقيت عُمان +04:00)
  venue: "قاعة أرينا",                  // اسم القاعة
  city: "",                          // المدينة
  mapUrl: "https://www.google.com/maps/search/?api=1&query=%D9%82%D8%A7%D8%B9%D8%A9+%D8%A3%D8%B1%D9%8A%D9%86%D8%A7", // رابط الموقع من خرائط قوقل
  deadline: "",                          // اتركيه فاضي لإخفائه
  notes: "",        // ملاحظات (اتركيه فاضي لإخفائه)
  allowCount: true,                      // هل الضيفة تختار عدد الحضور؟
  maxCount: 6,                           // أكبر عدد مسموح
  // رابط Google Apps Script (بعد الإعداد). لو فاضي = نسخة تجريبية
  scriptUrl: ""
};
/* ============================================================ */

const $ = id => document.getElementById(id);
const ar = n => String(n).replace(/\d/g, d => "٠١٢٣٤٥٦٧٨٩"[d]);

// Fill invitation
$("hosts").textContent = CONFIG.hosts;
$("bride").textContent = CONFIG.bride;
if (CONFIG.groom) { $("groom").textContent = CONFIG.groom; $("groomWrap").hidden = false; }
const eventDate = new Date(CONFIG.dateISO);
const tz = { timeZone: "Asia/Muscat" };
$("dateText").textContent = eventDate.toLocaleDateString("ar-OM", { ...tz, weekday: "long", day: "numeric", month: "long", year: "numeric" });
$("dateSub").textContent = eventDate.toLocaleDateString("ar-SA-u-ca-islamic-umalqura", { ...tz, day: "numeric", month: "long", year: "numeric" });
$("timeText").textContent = "الساعة " + eventDate.toLocaleTimeString("ar-OM", { ...tz, hour: "numeric", minute: "2-digit" });
$("venue").textContent = CONFIG.venue;
$("city").textContent = CONFIG.city;
$("mapBtn").href = CONFIG.mapUrl;
$("deadline").textContent = CONFIG.deadline; $("deadline").hidden = !CONFIG.deadline;
if (CONFIG.notes) $("notes").textContent = "• " + CONFIG.notes + " •"; else $("notes").hidden = true;


// Countdown
function tick() {
  const ms = eventDate - Date.now();
  if (ms <= 0) { $("countdown").hidden = true; document.querySelector(".cd-title").hidden = true; return; }
  $("cdD").textContent = ar(Math.floor(ms / 864e5));
  $("cdH").textContent = ar(Math.floor(ms / 36e5) % 24);
  $("cdM").textContent = ar(Math.floor(ms / 6e4) % 60);
  $("cdS").textContent = ar(Math.floor(ms / 1e3) % 60);
}
tick(); setInterval(tick, 1000);

// Personal link: ?n=الاسم fills the name
const params = new URLSearchParams(location.search);
if (params.get("n")) $("name").value = params.get("n");

// RSVP state
let choice = null, count = 1;
document.querySelectorAll(".choice").forEach(b => b.addEventListener("click", () => {
  choice = b.dataset.v;
  document.querySelectorAll(".choice").forEach(x => x.setAttribute("aria-pressed", x === b));
  $("countBox").classList.toggle("show", choice !== "no" && CONFIG.allowCount);
  $("err").textContent = "";
}));
const setCount = n => { count = Math.min(CONFIG.maxCount, Math.max(1, n)); $("countOut").textContent = ar(count); };
$("plus").onclick = () => setCount(count + 1);
$("minus").onclick = () => setCount(count - 1);
setCount(1);

function showDone(c, n) {
  $("formView").hidden = true;
  $("doneView").classList.add("show");
  if (c === "yes") {
    $("doneEmoji").textContent = "✦";
    $("doneTitle").textContent = "بانتظاركم";
    $("doneText").textContent = CONFIG.allowCount ? `تم تأكيد حضور ${ar(n)} ${n > 2 ? "أشخاص" : n === 2 ? "شخصين" : "شخص"}، يسعدنا وجودكم` : "تم تأكيد حضوركم، يسعدنا وجودكم";
  } else if (c === "maybe") {
    $("doneEmoji").textContent = "✦";
    $("doneTitle").textContent = "نتمنى نشوفكم";
    $("doneText").textContent = "شكراً لكم، وإذا تأكدتم تقدرون تفتحون الرابط وتعدلون ردكم";
  } else {
    $("doneEmoji").textContent = "✦";
    $("doneTitle").textContent = "نتفهم ذلك";
    $("doneText").textContent = "شكراً لإبلاغنا، وتمنياتكم الطيبة تكفينا";
  }
}

// Remember previous answer on this phone
try {
  const saved = JSON.parse(localStorage.getItem("rsvp") || "null");
  if (saved) showDone(saved.c, saved.n);
} catch (e) {}

$("again").onclick = () => { $("doneView").classList.remove("show"); $("formView").hidden = false; };


// One random id per phone, so the same guest editing their answer updates one row
function guestId() {
  let id = null;
  try { id = localStorage.getItem("gid"); } catch (e) {}
  if (!id) {
    id = Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
    try { localStorage.setItem("gid", id); } catch (e) {}
  }
  return id;
}

$("submit").onclick = async () => {
  const name = $("name").value.trim();
  if (!name) { $("err").textContent = "فضلاً اكتبي الاسم"; $("name").focus(); return; }
  if (!choice) { $("err").textContent = "فضلاً اختاري: بحضر أو ربما أو أعتذر"; return; }
  const n = choice === "no" ? 0 : (CONFIG.allowCount ? count : 1);

  $("submit").disabled = true; $("submit").textContent = "جاري الإرسال...";
  try {
    if (CONFIG.scriptUrl) {
      await fetch(CONFIG.scriptUrl, {
        method: "POST", mode: "no-cors",
        body: new URLSearchParams({ id: guestId(), name, status: { yes: "حاضر", maybe: "ربما", no: "معتذر" }[choice], count: n })
      });
    } else {
      await new Promise(r => setTimeout(r, 600)); // sample mode
    }
    try { localStorage.setItem("rsvp", JSON.stringify({ c: choice, n })); } catch (e) {}
    showDone(choice, n);
  } catch (e) {
    $("err").textContent = "صار خطأ في الاتصال، حاولي مرة ثانية";
  } finally {
    $("submit").disabled = false; $("submit").textContent = "إرسال";
  }
};

// On phones, start slightly scrolled so the design sits under the status bar
(function () {
  try { if ("scrollRestoration" in history) history.scrollRestoration = "manual"; } catch (e) {}
  if (!matchMedia("(pointer: coarse)").matches) return;
  const nudge = () => { if (window.scrollY < 5) window.scrollTo(0, 50); };
  window.addEventListener("load", () => { nudge(); setTimeout(nudge, 150); });
})();
</script>
